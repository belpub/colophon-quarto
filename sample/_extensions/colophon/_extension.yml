title: Colophon
author: Beldene Publishing
version: 0.2.0
quarto-required: ">=1.10.0"
contributes:
  project:
    project:
      type: book
    format: colophon-pdf
  formats:
    pdf:
      pdf-engine: xelatex
      documentclass: book
      classoption: [oneside]
      papersize: a4
      geometry: "a4paper, margin=2cm"
      toc: false
      number-sections: true
      fig-pos: "H"
      include-in-header:
        - preamble.tex
